name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        env:
          ADMOB_APP_ID_ANDROID: ${{ vars.ADMOB_APP_ID_ANDROID }}
        run: |
          flutter create . --platforms=android --org online.shortseris --project-name shortseris_app

          # Fix AdMob/AndroidX startup compatibility on release builds.
          python3 - <<'PY_GRADLE'
          from pathlib import Path
          import re

          app_gradle = Path("android/app/build.gradle.kts")
          g = app_gradle.read_text()

          if 'androidx.work:work-runtime:2.11.2' not in g:
              g += '\n\ndependencies {\n    implementation("androidx.work:work-runtime:2.11.2")\n}\n'

          release_pattern = re.compile(
              r'(release\s*\{)(.*?)(\n\s*\})',
              re.S,
          )

          def patch_release(match):
              body = match.group(2)
              if 'isMinifyEnabled' not in body:
                  body += '\n            isMinifyEnabled = false'
              else:
                  body = re.sub(
                      r'isMinifyEnabled\s*=\s*true',
                      'isMinifyEnabled = false',
                      body,
                  )
              if 'isShrinkResources' not in body:
                  body += '\n            isShrinkResources = false'
              else:
                  body = re.sub(
                      r'isShrinkResources\s*=\s*true',
                      'isShrinkResources = false',
                      body,
                  )
              return match.group(1) + body + match.group(3)

          g, count = release_pattern.subn(patch_release, g, count=1)
          if count == 0:
              raise SystemExit("Could not find Android release buildType")
          app_gradle.write_text(g)

          rules = [
              "# SHORT SERIES TV - Android startup/AdMob compatibility",
              "-keep class androidx.room.** { *; }",
              "-keep class * extends androidx.room.RoomDatabase { *; }",
              "-keep class androidx.work.** { *; }",
              "-keep class androidx.startup.** { *; }",
              "-keep class com.google.android.gms.ads.** { *; }",
              "-keep class com.google.android.ump.** { *; }",
              "-dontwarn androidx.work.**",
              "",
          ]
          Path("android/app/proguard-rules.pro").write_text("\n".join(rules))
          PY_GRADLE
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              marker = ">"
              pos = s.find(marker)
              s = s[:pos+1] + '\n    <uses-permission android:name="android.permission.INTERNET"/>' + s[pos+1:]
          import re, os
          s = re.sub(r'android:label="[^"]*"', 'android:label="SHORT SERIES TV"', s, count=1)
          admob_app_id = (os.environ.get("ADMOB_APP_ID_ANDROID") or "").strip()
          if not admob_app_id:
              admob_app_id = "ca-app-pub-3494213319779695~6086363285"
          meta = f'''\n        <meta-data
            android:name="com.google.android.gms.ads.APPLICATION_ID"
            android:value="{admob_app_id}"/>'''
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", meta + "\n    </application>", 1)
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/short_series_tv_icon"', s, count=1)
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@drawable/short_series_tv_icon"', s, count=1)
          p.write_text(s)

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "short_series_tv_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#E50914" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M18,20h72v7h-72z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M39,34L39,78L76,56z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M18,84h72v5h-72z"/>
          </vector>
          """)

          kotlin_root = Path("android/app/src/main/kotlin")
          main_activity = next(kotlin_root.rglob("MainActivity.kt"))
          package_name = ".".join(main_activity.parent.relative_to(kotlin_root).parts)

          main_activity.write_text(f"""package {package_name}

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugins.googlemobileads.GoogleMobileAdsPlugin

          class MainActivity : FlutterActivity() {{
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  GoogleMobileAdsPlugin.registerNativeAdFactory(
                      flutterEngine,
                      "shortSeriesNative",
                      ShortSeriesNativeAdFactory(this)
                  )
              }}

              override fun cleanUpFlutterEngine(flutterEngine: FlutterEngine) {{
                  GoogleMobileAdsPlugin.unregisterNativeAdFactory(
                      flutterEngine,
                      "shortSeriesNative"
                  )
                  super.cleanUpFlutterEngine(flutterEngine)
              }}
          }}
          """)

          java_dir = Path("android/app/src/main/java") / Path(*package_name.split("."))
          java_dir.mkdir(parents=True, exist_ok=True)
          (java_dir / "ShortSeriesNativeAdFactory.java").write_text(f"""package {package_name};

          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import com.google.android.gms.ads.nativead.MediaView;
          import com.google.android.gms.ads.nativead.NativeAd;
          import com.google.android.gms.ads.nativead.NativeAdView;

          import java.util.Map;

          import io.flutter.plugins.googlemobileads.NativeAdFactory;

          public final class ShortSeriesNativeAdFactory
                  implements NativeAdFactory {{

              private final Context context;

              public ShortSeriesNativeAdFactory(Context context) {{
                  this.context = context;
              }}

              private int dp(int value) {{
                  return Math.round(
                      value * context.getResources().getDisplayMetrics().density
                  );
              }}

              private TextView text(int sizeSp, int color, int style) {{
                  TextView view = new TextView(context);
                  view.setTextColor(color);
                  view.setTextSize(sizeSp);
                  view.setTypeface(Typeface.DEFAULT, style);
                  return view;
              }}

              @Override
              public NativeAdView createNativeAd(
                      NativeAd nativeAd,
                      Map<String, Object> customOptions) {{

                  NativeAdView adView = new NativeAdView(context);
                  adView.setBackgroundColor(Color.rgb(17, 18, 20));

                  LinearLayout root = new LinearLayout(context);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(14), dp(12), dp(14), dp(14));
                  root.setLayoutParams(new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  LinearLayout header = new LinearLayout(context);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  ImageView icon = new ImageView(context);
                  LinearLayout.LayoutParams iconParams =
                      new LinearLayout.LayoutParams(dp(46), dp(46));
                  iconParams.setMarginEnd(dp(10));
                  icon.setLayoutParams(iconParams);
                  icon.setScaleType(ImageView.ScaleType.CENTER_CROP);

                  LinearLayout titles = new LinearLayout(context);
                  titles.setOrientation(LinearLayout.VERTICAL);
                  titles.setLayoutParams(new LinearLayout.LayoutParams(
                      0,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      1f
                  ));

                  TextView headline = text(
                      16,
                      Color.WHITE,
                      Typeface.BOLD
                  );
                  TextView advertiser = text(
                      11,
                      Color.rgb(180, 180, 180),
                      Typeface.NORMAL
                  );

                  TextView badge = text(
                      10,
                      Color.rgb(255, 220, 80),
                      Typeface.BOLD
                  );
                  badge.setText("Ad");
                  badge.setPadding(dp(7), dp(3), dp(7), dp(3));

                  titles.addView(headline);
                  titles.addView(advertiser);
                  header.addView(icon);
                  header.addView(titles);
                  header.addView(badge);

                  MediaView media = new MediaView(context);
                  LinearLayout.LayoutParams mediaParams =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(150)
                      );
                  mediaParams.topMargin = dp(10);
                  media.setLayoutParams(mediaParams);

                  TextView body = text(
                      13,
                      Color.rgb(220, 220, 220),
                      Typeface.NORMAL
                  );
                  LinearLayout.LayoutParams bodyParams =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );
                  bodyParams.topMargin = dp(8);
                  body.setLayoutParams(bodyParams);
                  body.setMaxLines(2);

                  Button cta = new Button(context);
                  LinearLayout.LayoutParams ctaParams =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(46)
                      );
                  ctaParams.topMargin = dp(10);
                  cta.setLayoutParams(ctaParams);
                  cta.setAllCaps(false);

                  root.addView(header);
                  root.addView(media);
                  root.addView(body);
                  root.addView(cta);
                  adView.addView(root);

                  adView.setHeadlineView(headline);
                  adView.setAdvertiserView(advertiser);
                  adView.setIconView(icon);
                  adView.setMediaView(media);
                  adView.setBodyView(body);
                  adView.setCallToActionView(cta);

                  headline.setText(nativeAd.getHeadline());

                  if (nativeAd.getAdvertiser() == null) {{
                      advertiser.setVisibility(View.GONE);
                  }} else {{
                      advertiser.setText(nativeAd.getAdvertiser());
                  }}

                  if (nativeAd.getIcon() == null) {{
                      icon.setVisibility(View.GONE);
                  }} else {{
                      icon.setImageDrawable(nativeAd.getIcon().getDrawable());
                  }}

                  if (nativeAd.getMediaContent() == null) {{
                      media.setVisibility(View.GONE);
                  }} else {{
                      media.setMediaContent(nativeAd.getMediaContent());
                  }}

                  if (nativeAd.getBody() == null) {{
                      body.setVisibility(View.GONE);
                  }} else {{
                      body.setText(nativeAd.getBody());
                  }}

                  if (nativeAd.getCallToAction() == null) {{
                      cta.setVisibility(View.GONE);
                  }} else {{
                      cta.setText(nativeAd.getCallToAction());
                  }}

                  adView.setNativeAd(nativeAd);
                  return adView;
              }}
          }}
          """)
          PY

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if flutter build apk --release \
              --dart-define=ADMOB_BANNER_ID="${{ vars.ADMOB_BANNER_ID_ANDROID || 'ca-app-pub-3494213319779695/7715973870' }}" \
              --dart-define=ADMOB_NATIVE_HOME_ID="${{ vars.ADMOB_NATIVE_HOME_ID_ANDROID || 'ca-app-pub-3494213319779695/2307559512' }}" \
              --dart-define=ADMOB_NATIVE_DETAILS_ID="${{ vars.ADMOB_NATIVE_DETAILS_ID_ANDROID || 'ca-app-pub-3494213319779695/6190964204' }}" \
              --dart-define=ADMOB_INTERSTITIAL_ID="${{ vars.ADMOB_INTERSTITIAL_ID_ANDROID || 'ca-app-pub-3494213319779695/7842123070' }}" \
              --dart-define=ADMOB_ENABLED="${{ vars.ADMOB_ENABLED || 'true' }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient build/download failure. Retrying..."
              sleep 15
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHORT-SERIES-TV-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30