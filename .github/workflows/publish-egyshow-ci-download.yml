name: Publish EGYSHOW Android CI APK as direct download
on:
  push:
    branches:
      - feature/egyshow-direct-yacine-channels-20261104
    paths:
      - .github/workflows/publish-egyshow-ci-download.yml

permissions:
  contents: write
  actions: read

jobs:
  release-ci-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: "42048975518"
      ARTIFACT: "EGYSHOW-CI-APK-REQUIRES-SERVER-SIGNING"
      VERSION_TAG: "egyshow-android-v2.0.17-ci-preview"
    steps:
      - name: Retrieve successfully built GitHub Actions APK
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download "$SOURCE_RUN" --repo "$REPO" -n "$ARTIFACT" -D artifact
          test -s artifact/app-release.apk
          ls -lh artifact/app-release.apk
      - name: Publish clearly labeled testing-only APK
        run: |
          set -euo pipefail
          cp artifact/app-release.apk artifact/EGYSHOW_Android_v2.0.17_CI_TEST_ONLY.apk
          sha256sum artifact/EGYSHOW_Android_v2.0.17_CI_TEST_ONLY.apk
          if gh release view "$VERSION_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists; uploading asset with clobber."
            gh release upload "$VERSION_TAG" artifact/EGYSHOW_Android_v2.0.17_CI_TEST_ONLY.apk --repo "$REPO" --clobber
          else
            gh release create "$VERSION_TAG" artifact/EGYSHOW_Android_v2.0.17_CI_TEST_ONLY.apk \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease \
              --title "EGYSHOW Android v2.0.17 - CI TEST ONLY (not official update)" \
              --notes "Testing-only build of EGYSHOW Android v2.0.17 (versionCode 25), including live-channel playback diagnostics. This APK is NOT signed with the original EGYSHOW production key, must NOT replace the official installed app, and has not been tested with all live TV sources on a physical Android device. Shared here only to provide an accessible download link outside ChatGPT. Install only in a separate test environment if Android accepts the APK."
          fi
          gh release view "$VERSION_TAG" --repo "$REPO" --json url,assets
