name: Build EGYSHOW Native Android APK
on:
  push:
    branches:
      - egyshow-native-mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android shell
        run: |
          flutter create --platforms=android --org com.egyshow --project-name egyshow_mobile .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if "android.permission.ACCESS_NETWORK_STATE" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="EGYSHOW"', s, count=1)
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/egyshow_icon"', s, count=1)
          p.write_text(s)
          icon = Path("android/app/src/main/res/drawable")
          icon.mkdir(parents=True,exist_ok=True)
          (icon / "egyshow_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#E50914" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M39,28L39,80L82,54z"/>
          </vector>""")
          PY
      - name: Configure verified production signing
        env:
          EGYSHOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.EGYSHOW_RELEASE_KEYSTORE_BASE64 }}
          EGYSHOW_RELEASE_STORE_PASSWORD: ${{ secrets.EGYSHOW_RELEASE_STORE_PASSWORD }}
          EGYSHOW_RELEASE_KEY_ALIAS: ${{ secrets.EGYSHOW_RELEASE_KEY_ALIAS }}
          EGYSHOW_RELEASE_KEY_PASSWORD: ${{ secrets.EGYSHOW_RELEASE_KEY_PASSWORD }}
        run: python3 scripts/configure_egyshow_release_signing.py
      - name: Dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze --no-fatal-infos lib/main.dart
      - name: Build APK
        run: flutter build apk --release
      - name: Verify APK matches EGYSHOW 2.0.1 signing certificate
        run: |
          set -euo pipefail
          SDK_DIR=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          SIGNER="$(find "$SDK_DIR/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER"
          CERT="$("$SIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          EXPECTED="1c390398d4c4efb79bfa300c061590c9f272f5db33978158e114d5a320a95daa"
          if [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::EGYSHOW release signing certificate mismatch. Refusing to publish an incompatible APK."
            exit 1
          fi
          echo "Original EGYSHOW signing certificate verified."
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EGYSHOW-Native-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
