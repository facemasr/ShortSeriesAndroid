name: Fix Ad Placement Version Lookup

on:
  push:
    branches:
      - feat/ad-platform-foundation
    paths:
      - ".github/workflows/fix-ad-placement-version.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ad-platform-foundation
          fetch-depth: 0
      - name: Remove blocking package info lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/ad_placements.dart')
          s = p.read_text()
          pattern = re.compile(
              r"  Future<String> _resolveAppVersion\(\) async \{.*?\n  \}\n\n  String get _platform",
              re.S,
          )
          replacement = '''  String _resolveAppVersion() {
            final override = widget.appVersionOverride?.trim() ?? '';
            if (override.isNotEmpty) return override;
            final raw = Api.I.config['app_version'];
            if (raw != null && raw.toString().trim().isNotEmpty) {
              return raw.toString().trim();
            }
            return '';
          }

          String get _platform'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('version lookup marker not found')
          s = s.replace(
              '    final version = await _resolveAppVersion();',
              '    final version = _resolveAppVersion();',
              1,
          )
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "shortseries-ci"
          git config user.email "actions@users.noreply.github.com"
          git add lib/ad_placements.dart
          git commit -m "perf: remove blocking ad placement version lookup"
          git push origin HEAD:feat/ad-platform-foundation
