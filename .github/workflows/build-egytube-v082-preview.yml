name: EGYTUBE 0.8.2 Preview — AADS & Update Integration
on:
  push:
    branches:
      - egytube-v082-aads-update-integration
    paths:
      - 'egytube-v050/**'
      - '.github/workflows/build-egytube-v082-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate source and prevent AADS regression
        run: |
          grep -Fq "data-aa='2460254'" egytube-v050/app/src/main/java/com/egytube/rebuilt/AdSlots.java
          grep -Fq "https://ad.a-ads.com/2460254/?size=320x100" egytube-v050/app/src/main/java/com/egytube/rebuilt/AdSlots.java
          grep -Fq "AdSlots.AADS_320x100" egytube-v050/app/src/main/java/com/egytube/rebuilt/MainActivity.java
          grep -Fq "applicationId 'com.egytube.official'" egytube-v050/app/build.gradle
          grep -Fq "applicationIdSuffix '.preview'" egytube-v050/app/build.gradle
      - name: Build Android preview APK
        working-directory: ./egytube-v050
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Verify Android package integrity
        run: |
          set -e
          APK=egytube-v050/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep 'package: name=.com.egytube.official.preview'
          for needle in MainActivity AdSlots NativeWatchView; do
            found=0
            for dex in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*[.]dex$'); do
              if unzip -p "$APK" "$dex" | strings | grep -q "$needle"; then found=1;break;fi
            done
            test "$found" -eq 1
          done
          cp "$APK" EGYTUBE-v0.8.2-AADS-PREVIEW.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EGYTUBE-v082-AADS-PREVIEW
          path: EGYTUBE-v0.8.2-AADS-PREVIEW.apk
          if-no-files-found: error
      - name: Publish preview only (never overwrite official latest.json)
        run: |
          set -e
          mkdir -p public-downloads
          cp EGYTUBE-v0.8.2-AADS-PREVIEW.apk public-downloads/EGYTUBE-v0.8.2-AADS-PREVIEW.apk
          python3 - <<'PY'
          import hashlib, json, pathlib
          apk=pathlib.Path("public-downloads/EGYTUBE-v0.8.2-AADS-PREVIEW.apk")
          preview={
            "app":"EGYTUBE Preview",
            "packageName":"com.egytube.official.preview",
            "versionCode":82,
            "versionName":"0.8.2-preview",
            "download_url":"https://raw.githubusercontent.com/facemasr/ShortSeriesAndroid/egytube-v082-aads-update-integration/public-downloads/EGYTUBE-v0.8.2-AADS-PREVIEW.apk",
            "sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
            "sizeBytes":apk.stat().st_size,
            "adUnits":["AADS:2460254","data527:300x250","data527:468x60","data527:320x50","Bonepa"],
            "preview":True,
            "notes":"نسخة اختبارية مستقلة عن التطبيق الرسمي. لا تُستخدم كتحديث فوق النسخة الرسمية."
          }
          pathlib.Path("public-downloads/preview-v082.json").write_text(json.dumps(preview,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-downloads/EGYTUBE-v0.8.2-AADS-PREVIEW.apk public-downloads/preview-v082.json
          git commit -m "Publish separate EGYTUBE 0.8.2 preview and manifest" || exit 0
          git push origin HEAD:egytube-v082-aads-update-integration
