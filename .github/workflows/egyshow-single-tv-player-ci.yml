name: EGYSHOW no-TV app shell checks
on:
  push:
    branches:
      - fix/egyshow-one-internal-tv-player-20261107
  pull_request:
    branches:
      - feature/egyshow-direct-yacine-channels-20261104
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze EGYSHOW app shell
        run: flutter analyze --no-fatal-infos lib/main.dart
      - name: Verify TV channels are absent from app navigation
        run: flutter test test/yacine_single_player_policy_test.dart
