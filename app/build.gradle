plugins {
    id 'com.android.application'
}

android {
    namespace 'online.shortseris.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'online.shortseris.app'
        minSdk 21
        targetSdk 36
        versionCode 6
        versionName '4.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
