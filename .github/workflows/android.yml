name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: |
          flutter create . --platforms=android --org online.shortseris --project-name shortseris_app
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              marker = ">"
              pos = s.find(marker)
              s = s[:pos+1] + '\n    <uses-permission android:name="android.permission.INTERNET"/>' + s[pos+1:]
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="SHORT SERIES TV"', s, count=1)
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/short_series_tv_icon"', s, count=1)
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@drawable/short_series_tv_icon"', s, count=1)
          p.write_text(s)

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "short_series_tv_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#E50914" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M18,20h72v7h-72z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M39,34L39,78L76,56z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M18,84h72v5h-72z"/>
          </vector>
          """)
          PY

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHORT-SERIES-TV-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
