name: EGYTUBE Native Rebuild
on:
  push:
    branches:
      - egytube-rebuild-20261024
    paths:
      - 'egytube-v050/**'
      - '.github/workflows/build-egytube-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 build components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android APK
        working-directory: ./egytube-v050
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Verify manifest, DEX, APK signature
        run: |
          set -e
          APK=egytube-v050/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -p "$APK" classes.dex | strings | grep -q 'MainActivity'
          cp "$APK" EGYTUBE-Native-v0.5.0-FIXED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EGYTUBE-Native-v050-APK
          path: EGYTUBE-Native-v0.5.0-FIXED.apk
          if-no-files-found: error
      - name: Publish standalone test APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "egytube-native-v0.5.0-fixed" EGYTUBE-Native-v0.5.0-FIXED.apk --target "$GITHUB_SHA" --title "EGYTUBE Native 0.5.0 Test" --notes "Fresh rebuild; independent install; native lists; official YouTube embed; EGYSHOW categories. Debug APK: not verified on physical device." --prerelease || gh release upload "egytube-native-v0.5.0-fixed" EGYTUBE-Native-v0.5.0-FIXED.apk --clobber
