name: Build EGYSHOW Native Android APK
on:
  push:
    branches:
      - egyshow-native-mobile
      - feature/egyshow-direct-yacine-channels-20261104
  workflow_dispatch:

concurrency:
  group: egyshow-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android shell
        run: |
          flutter create --platforms=android --org com.egyshow --project-name egyshow_mobile .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if "android.permission.ACCESS_NETWORK_STATE" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="EGYSHOW"', s, count=1)
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/egyshow_icon"', s, count=1)
          p.write_text(s)
          icon = Path("android/app/src/main/res/drawable")
          icon.mkdir(parents=True,exist_ok=True)
          (icon / "egyshow_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#E50914" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M39,28L39,80L82,54z"/>
          </vector>""")
          PY
      - name: Allow provider-declared dynamic plain HTTP media streams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          # EGY TV Sport Windows opens public HTTP stream URLs from dynamic
          # provider hosts. Android Media3/VLC otherwise rejects every new
          # host outside a hard-coded allowlist even when API resolution works.
          # The catalog/API/auth endpoints themselves stay HTTPS. No DRM,
          # authentication, token or region bypass is performed.
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          if 'android:networkSecurityConfig=' not in source:
              source = source.replace('<application', '<application android:networkSecurityConfig="@xml/egyshow_network_security"', 1)
          manifest.write_text(source)
          output = Path('android/app/src/main/res/xml/egyshow_network_security.xml')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('<?xml version="1.0" encoding="utf-8"?>\n'
                            '<network-security-config>\n'
                            '  <base-config cleartextTrafficPermitted="true" />\n'
                            '</network-security-config>\n')
          root = ET.parse(output).getroot()
          assert root.find('base-config').attrib['cleartextTrafficPermitted'] == 'true'
          print('Android native players may now open dynamic provider HTTP media hosts')
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Analyze Android playback and ad code
        run: flutter analyze --no-fatal-infos lib/main.dart lib/native_api.dart lib/yacine_direct_player.dart lib/yacine_channel_resolver.dart lib/yacine_stream_renewal.dart lib/yacine_media_format.dart lib/yacine_media_headers.dart lib/yacine_provider_policy.dart lib/yacine_vlc_m3u.dart lib/yacine_stream_probe.dart lib/yacine_channel_groups.dart lib/yacine_catalog_cache.dart lib/yacine_vlc_options.dart lib/yacine_stream_diagnostics.dart lib/yacine_vlc_player.dart lib/yacine_local_relay.dart lib/yacine_android_channel_service.dart lib/yacine_external_player.dart lib/yacine_playback_settings.dart lib/yacine_ytv_link_presets.dart lib/yacine_ytv_editor.dart lib/egy_tv_sport_hub.dart lib/native_banner_ads.dart lib/egyshow_global_ads.dart lib/native_player.dart
      - name: Test bounded temporary HLS segment validation
        run: flutter test test/yacine_stream_probe_test.dart test/yacine_media_format_test.dart test/yacine_media_headers_test.dart test/yacine_provider_policy_test.dart test/yacine_vlc_m3u_test.dart test/yacine_channel_resolver_test.dart test/yacine_stream_renewal_test.dart test/yacine_channel_groups_test.dart test/yacine_catalog_cache_test.dart test/yacine_vlc_options_test.dart test/yacine_bein1_pipeline_test.dart test/yacine_local_relay_test.dart test/yacine_android_channel_service_test.dart test/yacine_provider_id_recovery_test.dart test/yacine_external_player_test.dart test/yacine_ytv_link_presets_test.dart test/yacine_stale_id_nested_recovery_test.dart test/yacine_no_source_diagnostics_test.dart test/yacine_decoder_fallback_test.dart
      - name: Build APK
        run: flutter build apk --release
      - name: Validate CI candidate before private server signing
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK_DIR=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          AAPT="$(find "$SDK_DIR/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com.egyshow.egyshow_mobile' versionCode='36' versionName='2.0.28'"
          echo "CI candidate verified; NOT production-signed, NOT eligible for direct publication."
      - name: Upload CI APK candidate for private server signing
        uses: actions/upload-artifact@v4
        with:
          name: EGYSHOW-CI-APK-REQUIRES-SERVER-SIGNING
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
  preview-download:
    name: Publish testing-only ZIP after successful APK checks
    needs: android-apk
    if: github.ref == 'refs/heads/feature/egyshow-direct-yacine-channels-20261104'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested APK from this build
        uses: actions/download-artifact@v4
        with:
          name: EGYSHOW-CI-APK-REQUIRES-SERVER-SIGNING
          path: preview
      - name: Publish clearly labeled testing-only ZIP to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s preview/app-release.apk
          cp preview/app-release.apk preview/EGYSHOW_Android_v2.0.28_TEST_ONLY.apk
          (cd preview && zip -q -9 EGYSHOW_Android_v2.0.28_TEST_ONLY.zip EGYSHOW_Android_v2.0.28_TEST_ONLY.apk)
          TAG=egyshow-android-v2.0.28-ci-preview
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target "$SHA" \
              --prerelease \
              --title "EGYSHOW Android 2.0.28 - test build, not an official update" \
              --notes "This ZIP contains a CI-built APK with on-device API headers and an HLS local relay modeled on EGY TV Sport Windows. This is NOT signed with the original production key, NOT an in-place update, and NOT proof of successful real-channel playback on a physical Android device."
          fi
          gh release upload "$TAG" preview/EGYSHOW_Android_v2.0.28_TEST_ONLY.zip --repo "$REPO" --clobber
