name: Apply Player Ad Coordinator Wiring

on:
  push:
    branches:
      - feat/ad-platform-foundation
    paths:
      - ".github/workflows/apply-player-ad-coordinator.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ad-platform-foundation
          fetch-depth: 0
      - name: Wire player ad coordinator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('lib/main.dart')
          s = main.read_text()
          marker = "part 'ad_placements.dart';\n"
          if "part 'player_ads.dart';" not in s:
              if marker not in s:
                  raise SystemExit('main part marker not found')
              s = s.replace(marker, marker + "part 'player_ads.dart';\n", 1)
              main.write_text(s)

          admob = Path('lib/admob_ads.dart')
          s = admob.read_text()
          if 'bool _playerAdRequestInFlight = false;' not in s:
              marker = '  int _episodeTransitions = 0;\n'
              if marker not in s:
                  raise SystemExit('admob field marker not found')
              s = s.replace(
                  marker,
                  marker + '  bool _playerAdRequestInFlight = false;\n',
                  1,
              )

          if 'Future<bool> _maybeShowLegacyPlaybackInterstitial' not in s:
              method_pattern = re.compile(
                  r"  Future<bool> maybeShowPlaybackInterstitial\(\{\n"
                  r"\s+required bool betweenEpisodes,\n"
                  r"\s+\}\) async \{.*?\n  \}\n\}",
                  re.S,
              )
              match = method_pattern.search(s)
              if not match:
                  raise SystemExit('playback interstitial method not found')
              replacement = r'''  bool get _adPlatformEnabled {
            final raw = Api.I.config['ad_platform'];
            if (raw is! Map) return false;
            return _adBool(Map<String, dynamic>.from(raw)['enabled']);
          }

          String get _configuredAppVersion {
            final value = Api.I.config['app_version'];
            return (value ?? '').toString().trim();
          }

          Future<bool> maybeShowPlaybackInterstitial({
            required bool betweenEpisodes,
            String contentType = '',
            int? contentId,
            List<int> genreIds = const <int>[],
          }) async {
            if (_playerAdRequestInFlight) return false;
            _playerAdRequestInFlight = true;
            try {
              final coordinator = PlayerAdCoordinator(
                decisionClient: AdDecisionClient.I,
                showInterstitial: ({required bool betweenEpisodes}) =>
                    _maybeShowLegacyPlaybackInterstitial(
                  betweenEpisodes: betweenEpisodes,
                ),
                ageGroup: _ageGroup,
                membershipTier: _membershipTier,
                remoteEnabled: _adPlatformEnabled,
                platform: Platform.isAndroid ? 'android' : 'other',
                appVersion: _configuredAppVersion,
                locale: Api.I.locale,
              );
              return await coordinator.maybeShow(
                betweenEpisodes: betweenEpisodes,
                contentType: contentType,
                contentId: contentId,
                genreIds: genreIds,
              );
            } catch (_) {
              return false;
            } finally {
              _playerAdRequestInFlight = false;
            }
          }

          Future<bool> _maybeShowLegacyPlaybackInterstitial({
            required bool betweenEpisodes,
          }) async {
            if (!Platform.isAndroid || !enabled || _showingInterstitial) return false;

            if (betweenEpisodes) {
              _episodeTransitions++;
              if (_episodeTransitions % episodeEvery != 0) {
                unawaited(preloadInterstitial());
                return false;
              }
            } else {
              _playStarts++;
              if (_playStarts % playbackEvery != 0) {
                unawaited(preloadInterstitial());
                return false;
              }
            }

            if (!await _intervalAllows()) {
              unawaited(preloadInterstitial());
              return false;
            }

            final ad = _interstitial;
            if (ad == null) {
              unawaited(preloadInterstitial());
              return false;
            }

            _interstitial = null;
            _showingInterstitial = true;
            final done = Completer<bool>();

            ad.fullScreenContentCallback = FullScreenContentCallback(
              onAdShowedFullScreenContent: (_) {
                unawaited(_markShown());
              },
              onAdDismissedFullScreenContent: (shownAd) {
                shownAd.dispose();
                _showingInterstitial = false;
                if (!done.isCompleted) done.complete(true);
                unawaited(preloadInterstitial());
              },
              onAdFailedToShowFullScreenContent: (failedAd, error) {
                failedAd.dispose();
                _showingInterstitial = false;
                if (!done.isCompleted) done.complete(false);
                unawaited(preloadInterstitial());
              },
            );

            ad.show();
            return done.future;
          }
          }'''
              s = s[:match.start()] + replacement + s[match.end():]
          admob.write_text(s)

          player = Path('lib/pro_player.dart')
          s = player.read_text()
          if 'contentType:type' not in s:
              pattern = re.compile(
                  r"(await\s+AdMobService\.I\.maybeShowPlaybackInterstitial\(\s*"
                  r"betweenEpisodes\s*:\s*betweenEpisodes\s*,)(\s*\);)",
                  re.S,
              )
              replacement = (
                  r"\1\n          contentType:type,\n          contentId:id,\2"
              )
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('pro player ad call marker not found')
          player.write_text(s)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "shortseries-ci"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart lib/admob_ads.dart lib/pro_player.dart
          git commit -m "feat: route player ads through decision engine"
          git push origin HEAD:feat/ad-platform-foundation
