name: Ad Platform Branch CI

on:
  push:
    branches:
      - feat/ad-platform-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Format check changed ad-platform files
        run: |
          files=$(git diff --name-only 1885ac40e44d01886b7501a17a407686db0d9fcf...HEAD -- 'lib/*.dart' 'test/*.dart')
          if [ -n "$files" ]; then
            dart format --output=none --set-exit-if-changed $files
          fi
