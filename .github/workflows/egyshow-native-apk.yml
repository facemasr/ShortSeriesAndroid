name: Build EGYSHOW Native Android APK
on:
  push:
    branches:
      - egyshow-native-mobile
      - feature/egyshow-direct-yacine-channels-20261104
  workflow_dispatch:

concurrency:
  group: egyshow-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android shell
        run: |
          flutter create --platforms=android --org com.egyshow --project-name egyshow_mobile .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if "android.permission.ACCESS_NETWORK_STATE" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="EGYSHOW"', s, count=1)
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/egyshow_icon"', s, count=1)
          p.write_text(s)
          icon = Path("android/app/src/main/res/drawable")
          icon.mkdir(parents=True,exist_ok=True)
          (icon / "egyshow_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#E50914" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M39,28L39,80L82,54z"/>
          </vector>""")
          PY
      - name: Allow HTTP only for identified legacy live-stream hosts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          if 'android:networkSecurityConfig=' not in source:
              source = source.replace('<application', '<application android:networkSecurityConfig="@xml/egyshow_network_security"', 1)
          manifest.write_text(source)
          hosts = ["ar.ycncdn.online","re.varie-redirect.com","vod.ortas.sy","htvpalsat.mada.ps","flusonic-1.platinum-tv.com","m.live.net.sa","82.212.74.2","cdn.catiacast.video","ns8.indexforce.com","95.216.180.111","tv.mondeduloisir.fr","hls.tmacaraibes.com","contact-lh.akamaihd.net","fashiontv-fashiontv-loriginal-fr.samsung.wurl.com","cdn.webtv4.cdnfr.orange.fr","canli.haber365.com.tr","mtulqxgomrllive.mediatriple.net","akittv-live.ercdn.net","stream.yol.tv","57.bangiroua.xyz","142.44.214.231","82.212.74.100","foofootv.com","dminnvll.cdn.mangomolo.com","htvmada.mada.ps","live.alqudstoday.tv","htvajyal.mada.ps","vstream3.hadara.ps","htvint.mada.ps","ar116.ab-cdn.com","185.105.4.151","istream.binarywaves.com","vod.alikhbaria.net","51.255.84.28","nettvstreampaid.flashmediacast.com","streaming.aletejahtv.iq","38.96.175.40","137.74.205.201","jmc-live.ercdn.net"]
          dom = ''.join('    <domain includeSubdomains="true">'+escape(host)+'</domain>\n' for host in hosts)
          config = ('<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '  <base-config cleartextTrafficPermitted="false" />\n'
              '  <domain-config cleartextTrafficPermitted="true">\n'
              + dom + '  </domain-config>\n'
              '</network-security-config>\n')
          output = Path('android/app/src/main/res/xml/egyshow_network_security.xml')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(config)
          ET.parse(output)
          print('Native Android cleartext allowlist configured for',len(hosts),'HLS hosts')
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Analyze Android playback and ad code
        run: flutter analyze --no-fatal-infos lib/main.dart lib/yacine_direct_player.dart lib/yacine_channel_resolver.dart lib/yacine_stream_renewal.dart lib/yacine_media_format.dart lib/yacine_media_headers.dart lib/yacine_provider_policy.dart lib/yacine_vlc_m3u.dart lib/yacine_stream_probe.dart lib/yacine_channel_groups.dart lib/yacine_catalog_cache.dart lib/yacine_vlc_options.dart lib/yacine_stream_diagnostics.dart lib/yacine_vlc_player.dart lib/egy_tv_sport_hub.dart lib/native_banner_ads.dart lib/egyshow_global_ads.dart lib/native_player.dart
      - name: Test bounded temporary HLS segment validation
        run: flutter test test/yacine_stream_probe_test.dart test/yacine_media_format_test.dart test/yacine_media_headers_test.dart test/yacine_provider_policy_test.dart test/yacine_vlc_m3u_test.dart test/yacine_channel_resolver_test.dart test/yacine_stream_renewal_test.dart test/yacine_channel_groups_test.dart test/yacine_catalog_cache_test.dart test/yacine_vlc_options_test.dart test/yacine_bein1_pipeline_test.dart
      - name: Build APK
        run: flutter build apk --release
      - name: Validate CI candidate before private server signing
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK_DIR=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          AAPT="$(find "$SDK_DIR/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com.egyshow.egyshow_mobile' versionCode='25' versionName='2.0.17'"
          echo "CI candidate verified; NOT production-signed, NOT eligible for direct publication."
      - name: Upload CI APK candidate for private server signing
        uses: actions/upload-artifact@v4
        with:
          name: EGYSHOW-CI-APK-REQUIRES-SERVER-SIGNING
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
