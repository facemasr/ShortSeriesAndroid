name: EGYTUBE v0.6.9 UI Preview
on:
  push:
    branches:
      - egytube-v069-ui-preview
    paths:
      - 'egytube-v050/**'
      - '.github/workflows/build-egytube-ui-v069.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - egytube-rebuild-20261024
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 build components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile EGYTUBE Android 0.6.9 preview
        working-directory: ./egytube-v050
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Verify signed preview APK
        run: |
          set -e
          APK=egytube-v050/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -p "$APK" classes.dex | strings | grep 'MainActivity' > /dev/null
          found=0
          for dex in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*[.]dex'); do
            if unzip -p "$APK" "$dex" | strings | grep 'NativeWatchView' > /dev/null; then
              found=1
              break
            fi
          done
          test "$found" -eq 1
          cp "$APK" EGYTUBE-UI-Preview-v0.6.9.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EGYTUBE-UI-Preview-v069
          path: EGYTUBE-UI-Preview-v0.6.9.apk
          if-no-files-found: error
      - name: Publish preview APK for direct download (preview branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/egytube-v069-ui-preview'
        run: |
          set -e
          mkdir -p public-downloads
          cp EGYTUBE-UI-Preview-v0.6.9.apk public-downloads/EGYTUBE-UI-Preview-v0.6.9.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-downloads/EGYTUBE-UI-Preview-v0.6.9.apk
          git commit -m 'Publish EGYTUBE 0.6.9 UI preview APK for direct download' || exit 0
          git push origin HEAD:egytube-v069-ui-preview
