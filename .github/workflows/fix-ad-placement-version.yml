name: Fix Ad Placement Version Lookup

on:
  push:
    branches: [feat/ad-platform-foundation]
    paths: [.github/workflows/fix-ad-placement-version.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ad-platform-foundation
      - name: Remove blocking package info lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/ad_placements.dart')
          s=p.read_text()
          old='''  Future<String> _resolveAppVersion() async {
            final override = widget.appVersionOverride?.trim() ?? '';
            if (override.isNotEmpty) return override;
            try {
              final info = await PackageInfo.fromPlatform();
              return info.version;
            } catch (_) {
              return '';
            }
          }
'''
          new='''  String _resolveAppVersion() {
            final override = widget.appVersionOverride?.trim() ?? '';
            if (override.isNotEmpty) return override;
            final raw = Api.I.config['app_version'];
            if (raw != null && raw.toString().trim().isNotEmpty) {
              return raw.toString().trim();
            }
            return '';
          }
'''
          if old not in s:
              raise SystemExit('version lookup marker not found')
          s=s.replace(old,new,1)
          s=s.replace('    final version = await _resolveAppVersion();','    final version = _resolveAppVersion();',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name shortseries-ci
          git config user.email actions@users.noreply.github.com
          git add lib/ad_placements.dart
          git commit -m "perf: remove blocking ad placement version lookup"
          git push origin HEAD:feat/ad-platform-foundation
