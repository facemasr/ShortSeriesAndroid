name: Build standalone EGY TV PRO Android APK
on:
  push:
    branches:
      - app/egy-tv-pro-standalone-20261108
  workflow_dispatch:

concurrency:
  group: egytvpro-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android shell
        run: |
          flutter create --platforms=android --org com.egytv --project-name egy_tv_pro .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if "android.permission.ACCESS_NETWORK_STATE" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="EGY TV PRO"', s, count=1)
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/egyshow_icon"', s, count=1)
          p.write_text(s)
          icon = Path("android/app/src/main/res/drawable")
          icon.mkdir(parents=True,exist_ok=True)
          (icon / "egyshow_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#071925" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#22DAC5" android:pathData="M39,28L39,80L82,54z"/>
          </vector>""")
          PY
      - name: Set independent com.egytv.pro Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle.kts")
          if path.exists():
              value = path.read_text()
              pattern = r'applicationId\s*=\s*"[^"]+"'
              replacement = 'applicationId = "com.egytv.pro"'
          else:
              path = Path("android/app/build.gradle")
              value = path.read_text()
              pattern = r'applicationId\s+"[^"]+"'
              replacement = 'applicationId "com.egytv.pro"'
          assert re.search(pattern, value), "Missing applicationId in Gradle"
          path.write_text(re.sub(pattern, replacement, value, count=1))
          PY
      - name: Allow provider-declared dynamic plain HTTP media streams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          # EGY TV Sport Windows opens public HTTP stream URLs from dynamic
          # provider hosts. Android Media3/VLC otherwise rejects every new
          # host outside a hard-coded allowlist even when API resolution works.
          # The catalog/API/auth endpoints themselves stay HTTPS. No DRM,
          # authentication, token or region bypass is performed.
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          if 'android:networkSecurityConfig=' not in source:
              source = source.replace('<application', '<application android:networkSecurityConfig="@xml/egyshow_network_security"', 1)
          manifest.write_text(source)
          output = Path('android/app/src/main/res/xml/egyshow_network_security.xml')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('<?xml version="1.0" encoding="utf-8"?>\n'
                            '<network-security-config>\n'
                            '  <base-config cleartextTrafficPermitted="true" />\n'
                            '</network-security-config>\n')
          root = ET.parse(output).getroot()
          assert root.find('base-config').attrib['cleartextTrafficPermitted'] == 'true'
          print('Android native players may now open dynamic provider HTTP media hosts')
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Analyze Android playback and ad code
        run: flutter analyze --no-fatal-infos lib/egy_tv_pro_main.dart lib/native_api.dart lib/yacine_direct_player.dart lib/yacine_channel_resolver.dart lib/yacine_live_source_service.dart lib/yacine_channel_groups.dart lib/yacine_catalog_cache.dart lib/yacine_playback_settings.dart lib/yacine_ytv_editor.dart lib/yacine_ytv_link_presets.dart
      - name: Test bounded temporary HLS segment validation
        run: flutter test test/egy_tv_pro_live_source_test.dart
      - name: Build APK
        run: flutter build apk --release --target lib/egy_tv_pro_main.dart
      - name: Validate CI candidate before private server signing
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK_DIR=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          AAPT="$(find "$SDK_DIR/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com.egytv.pro' versionCode='1' versionName='1.0.0'"
          echo "CI candidate verified; NOT production-signed, NOT eligible for direct publication."
      - name: Upload CI APK candidate for private server signing
        uses: actions/upload-artifact@v4
        with:
          name: EGY-TV-PRO-v1.0.0-TEST-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
  preview-download:
    name: Publish testing-only ZIP after successful APK checks
    needs: android-apk
    if: github.ref == 'refs/heads/app/egy-tv-pro-standalone-20261108'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested APK from this build
        uses: actions/download-artifact@v4
        with:
          name: EGY-TV-PRO-v1.0.0-TEST-APK
          path: preview
      - name: Publish clearly labeled testing-only ZIP to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s preview/app-release.apk
          cp preview/app-release.apk preview/EGY_TV_PRO_v1.0.0_TEST_ONLY.apk
          (cd preview && zip -q -9 EGY_TV_PRO_v1.0.0_TEST_ONLY.zip EGY_TV_PRO_v1.0.0_TEST_ONLY.apk)
          TAG=egy-tv-pro-v1.0.0-test
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target "$SHA" \
              --prerelease \
              --title "EGY TV PRO Android 1.0.0 - test build, not an official update" \
              --notes "This ZIP contains a CI-built APK with on-device API headers and an HLS local relay modeled on EGY TV Sport Windows. This is NOT signed with the original production key, NOT an in-place update, and NOT proof of successful real-channel playback on a physical Android device."
          fi
          gh release upload "$TAG" preview/EGY_TV_PRO_v1.0.0_TEST_ONLY.zip --repo "$REPO" --clobber
