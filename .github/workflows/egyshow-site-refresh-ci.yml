name: EGYSHOW site-refresh Android validation

on:
  push:
    branches:
      - feature/egyshow-site-refresh-no-tv-20261121
      - fix/egyshow-member-playback-ads-20261125
  pull_request:
    branches:
      - feature/egyshow-direct-yacine-channels-20261104

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate EGYSHOW Android runner
        run: |
          flutter create --platforms=android --org com.egyshow --project-name egyshow_mobile .
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if "android.permission.ACCESS_NETWORK_STATE" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="EGYSHOW"', s, count=1)
          p.write_text(s)
          PY
          # flutter create generates a placeholder test for a different app template.
          rm -f test/widget_test.dart
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze EGYSHOW application
        run: flutter analyze lib/main.dart --no-fatal-infos
      - name: Run regression tests
        run: flutter test
      - name: Work around WebView dependency lint compiler crash (CI preview only)
        run: |
          # The generated AndroidWebkitLibrary.g.kt crashes the Android lint engine.
          # Leave app lint, Dart analysis and regression tests enabled.
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/egyshow-webview-preview.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              if (p.path == ':webview_flutter_android') {
                  p.pluginManager.withPlugin('com.android.library') {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          dsl.lint.checkReleaseBuilds = false
                      }
                  }
                  p.tasks.configureEach { t ->
                      if (t.name.startsWith('lintVital') && t.name.endsWith('Release')) {
                          t.enabled = false
                      }
                  }
              }
          }
          GRADLE
      - name: Build Android release candidate
        run: flutter build apk --release
      - name: Verify package and version
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK_DIR=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          AAPT="$(find "$SDK_DIR/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com.egyshow.egyshow_mobile' versionCode='43' versionName='2.0.35'"
          echo "Unsigned CI candidate only. Production release must use the existing EGYSHOW signing key."
      - uses: actions/upload-artifact@v4
        with:
          name: EGYSHOW-Android-2.0.35-CI-UNSIGNED
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
