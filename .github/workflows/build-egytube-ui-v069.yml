name: EGYTUBE 0.8.0 Official Release Unsigned Staging
on:
  push:
    branches:
      - egytube-v069-ui-preview
    paths:
      - 'egytube-v050/**'
      - '.github/workflows/build-egytube-ui-v069.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - egytube-rebuild-20261024
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egytube-v080-official-parallel-install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 build components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile EGYTUBE v0.8.0 non-debuggable release
        working-directory: ./egytube-v050
        run: gradle --no-daemon --console=plain :app:assembleRelease
      - name: Validate release APK before server-side signing
        run: |
          set -e
          APK=egytube-v050/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          # Final v2/v3 release signature is applied and verified by the private EGYSHOW server.
          unzip -p "$APK" classes.dex | strings | grep 'MainActivity' > /dev/null
          found=0
          for dex in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*[.]dex'); do
            if unzip -p "$APK" "$dex" | strings | grep 'NativeWatchView' > /dev/null; then
              found=1
              break
            fi
          done
          test "$found" -eq 1
          cp "$APK" EGYTUBE-v0.8.0-UNSIGNED-staging.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EGYTUBE-080-release-staging
          path: EGYTUBE-v0.8.0-UNSIGNED-staging.apk
          if-no-files-found: error
      - name: Publish preview APK for direct download (preview branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/egytube-v069-ui-preview'
        run: |
          set -e
          mkdir -p public-downloads
          cp EGYTUBE-v0.8.0-UNSIGNED-staging.apk public-downloads/EGYTUBE-v0.8.0-UNSIGNED-staging.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-downloads/EGYTUBE-v0.8.0-UNSIGNED-staging.apk
          git commit -m 'Stage EGYTUBE 0.8.0 APK for official server-side release signing' || exit 0
          git push origin HEAD:egytube-v080-official-parallel-install
