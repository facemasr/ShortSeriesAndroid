name: Feature Tests

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
