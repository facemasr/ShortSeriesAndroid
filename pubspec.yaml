name: egyshow_mobile
description: Native Flutter EGYSHOW catalog with the official website player and the same ads.
publish_to: none
version: 2.0.33+41

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  android_intent_plus: ^5.3.1
  video_player: ^2.9.5
  flutter_vlc_player: ^7.4.4
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
