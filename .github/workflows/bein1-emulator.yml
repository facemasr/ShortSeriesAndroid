name: EGYSHOW beIN SPORTS 1 Android emulator
on:
  workflow_dispatch:
  push:
    branches:
      - feature/egyshow-direct-yacine-channels-20261104
    paths:
      - .github/workflows/bein1-emulator.yml
      - integration_test/bein1_android_device_test.dart

permissions:
  contents: read

jobs:
  emulator-bein1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android device test environment
        run: |
          flutter create --platforms=android --org com.egyshow --project-name egyshow_mobile .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET" />\n    <application',1)
          s=s.replace('<application', '<application android:networkSecurityConfig="@xml/egyshow_test_network_security"',1)
          p.write_text(s)
          root=Path('android/app/src/main/res/xml')
          root.mkdir(parents=True,exist_ok=True)
          (root/'egyshow_test_network_security.xml').write_text("""<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false" />
            <domain-config cleartextTrafficPermitted="true">
              <domain>10.0.2.2</domain>
              <domain>re.varie-redirect.com</domain>
            </domain-config>
          </network-security-config>
          """)
          PY
          flutter pub get
      - name: Install media-generation tools for synthetic control clip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate original licensed-free control MP4
        run: |
          mkdir -p /tmp/egyshow_android
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc=size=480x270:rate=12' -t 20 -c:v mpeg4 -q:v 7 -movflags +faststart -y /tmp/egyshow_android/egyshow_control.mp4
          test -s /tmp/egyshow_android/egyshow_control.mp4
      - name: Boot Android and test native VLC plus actual beIN1 access
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            python3 -m http.server 8765 --bind 0.0.0.0 --directory /tmp/egyshow_android >/tmp/egyshow_local_video.log 2>&1 &
            sleep 2
            curl --fail -Is http://127.0.0.1:8765/egyshow_control.mp4 | head -n 1
            flutter test integration_test/bein1_android_device_test.dart -d emulator-5554 --reporter expanded
      - name: Explain provider restrictions
        if: always()
        run: echo 'HTTP 403 from beIN1 is an access denial by the upstream media server. No DRM, subscription or region bypass is performed.'
