name: Inspect EGYSHOW public tracking
on:
  push:
    branches: [egyshow-native-mobile]
    paths:
      - .github/workflows/egyshow-track-inspect.yml
permissions:
  contents: read
jobs:
  inspect-public-tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public analytics wiring
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re
          pages=['/','/ar/movies','/ar/series','/ar/movie/adam-uncovered',
                  '/assets/web/app.js','/r/y8t4w1h7?v=20261019-restore']
          for path in pages:
            url='https://egyshow.com'+path
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'EGYSHOW-Android-Integration/1.0'})
              with urllib.request.urlopen(req,timeout=15) as response:
                body=response.read().decode('utf-8','replace')
              print('PAGE',path,'BYTES',len(body))
              if not path.startswith('/assets') and not path.startswith('/r/'):
                scripts=re.findall(r'<script\b([^>]*)>(.*?)</script\s*>',body,re.S|re.I)
                for attrs,script in scripts:
                  src=re.findall(r'src\s*=\s*["\\x27]([^"\\x27]+)',attrs)
                  if src:print('EXTERNAL_JS',src[0][:150])
                  if script and any(x in script.lower() for x in ('histats','analytics','gtag','_paq','track','statcounter','visitor')):
                    print('INLINE_TRACKING_HINTS',','.join(re.findall(r'histats|analytics|gtag|track|statcounter|visitor|_paq',script,re.I)[:15]),'LENGTH',len(script))
                for x in ['histats','google-analytics','gtag','analytics','pixel','statistics','visitor']:
                  print('HTML_MATCH',x,body.lower().count(x))
              else:
                for needle in ['/api/v1/views','/api/v1/analytics','/api/v1/track','sendBeacon','pageview','visitor','analytics']:
                  matches=list(re.finditer(re.escape(needle),body,re.I))
                  print('JS_KEY',needle,'COUNT',len(matches))
                  for match in matches[:4]:
                    snip=body[max(0,match.start()-250):match.end()+260].replace('\n',' ')
                    snip=re.sub(r'(Bearer\\s+)[^\\s"\\x27]+',r'\\1[REDACTED]',snip)
                    print('CODE_CONTEXT',snip[:520])
            except Exception as e:print('ERROR',path,repr(e)[:180])
          PY
